name: Prepare Node workspace
description: Install the pinned Node runtime and locked dependencies.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm
    - run: npm ci
      shell: bash
