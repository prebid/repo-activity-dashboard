version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install
        - nvm use
        - npm ci --cache .npm --prefer-offline
        - npm run check
    build:
      commands:
        - DASHBOARD_AUTH_BACKEND=legacy npm run build:production
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - .next/cache/**/*
